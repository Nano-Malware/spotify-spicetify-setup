name: Shell checks

on:
  push:
  pull_request:

jobs:
  bash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
      - name: Check Bash syntax
        run: |
          find . -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
      - name: ShellCheck
        run: |
          find . -type f -name '*.sh' -print0 | xargs -0 -r shellcheck --severity=warning
      - name: Simulate first-run remote repair
        run: bash tests/simulate_spicetify_recovery.sh
      - name: Simulate launcher first-run flow
        run: bash tests/simulate_launch_first_run.sh
      - name: Simulate storage fallback behavior
        run: bash tests/simulate_detect_storage.sh
