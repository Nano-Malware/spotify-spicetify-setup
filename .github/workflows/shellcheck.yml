name: Shell checks

on:
  push:
  pull_request:

jobs:
  bash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Bash syntax
        run: |
          find . -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          severity: error
